<!DOCTYPE html>
<html>
<head>
    <title>My Mobile Website</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js">
    </script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
<div data-role="page" id="home">

    <div data-role="header">
        <h1>My Mobile Site</h1>
    </div>

    <div data-role="content">
        <h2>Welcome!</h2>
        <p>mobile website.</p>

        <a href="#about" data-role="button">Go to About</a>
        <a href="#contact" data-role="button">Contact Us</a>
    </div>

    <div data-role="footer">
        <h4>Footer - Home</h4>
    </div>

</div>
<div data-role="page" id="about">

    <div data-role="header">
        <h1>About Us</h1>
        <a href="#home" data-icon="home">Home</a>
    </div>

   
    <div data-role="footer">
        <h4>Footer - About</h4>
    </div>

</div>
<div data-role="page" id="contact">

    <div data-role="header">
        <h1>Contact</h1>
        <a href="#home" data-icon="home">Home</a>
    </div>

    <div data-role="content">

        <h2>Contact Form</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name">

            <label for="email">Email:</label>
            <input type="email" id="email">

            <button type="submit" data-role="button">Send</button>
        </form>

        <a href="#home" data-role="button">Back to Home</a>
    </div>

    <div data-role="footer">
        <h4>Footer - Contact</h4>
    </div>

</div>

</body>
</html>
